[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Build tooling: package, sign and publish robot releases"

# Deliberately a separate crate, not a subcommand of `updater`: this never ships to a
# robot. In particular it links the *full* `minisign` crate (which can sign), while the
# updater links only `minisign-verify` (which cannot) — the daemon has no business
# being able to sign anything.
[dependencies]
clap = { version = "4", features = ["derive", "env"] }
minisign = "0.9"
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
tar = "0.4"
toml = "1"
zstd = "0.13"
